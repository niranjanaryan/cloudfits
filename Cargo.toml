[workspace]
members = ["cloudfits-common", "cloudfits-cli", "cloudfits-tui"]
default-members = ["cloudfits-common", "cloudfits-cli", "cloudfits-tui"]
resolver = "3"

[workspace.package]
version = "1.0.0"
license = "MIT"
edition = "2024"
authors = ["Niranjan"]
description = "FOSS toolkit for estimating LLM inference costs (per hour and per month) and switching providers"
repository = "https://github.com/niranjanaryan/cloudfits"
homepage = "https://github.com/niranjanaryan/cloudfits"

[workspace.dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
sysinfo = "0.39"
which = "8.0"
ratatui = "0.29"
crossterm = "0.28"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
