name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: cloudfits-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: cloudfits-linux-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            name: cloudfits-darwin-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: cloudfits-darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: cloudfits-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == *"arm"* && "${{ matrix.os }}" == *"ubuntu"* ]]; then
            # Native ARM runner — target is the host, don't pass --target
            cargo build --release
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [[ "${{ matrix.os }}" == "windows-latest" ]] && ext=".exe"
          if [[ "${{ matrix.os }}" == *"arm"* && "${{ matrix.os }}" == *"ubuntu"* ]]; then
            build_dir="target/release"
          else
            build_dir="target/${{ matrix.target }}/release"
          fi
          cp "$build_dir/cloudfits$ext" "dist/${{ matrix.name }}$ext"
          cp "$build_dir/cloudfits-tui$ext" "dist/${{ matrix.name }}-tui$ext"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true