name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: cloudfits-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: cloudfits-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: cloudfits-darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: cloudfits-darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: cloudfits-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/cloudfits.exe dist/${{ matrix.name }}.exe
            cp target/${{ matrix.target }}/release/cloudfits-tui.exe dist/${{ matrix.name }}-tui.exe
          else
            cp target/${{ matrix.target }}/release/cloudfits dist/${{ matrix.name }}
            cp target/${{ matrix.target }}/release/cloudfits-tui dist/${{ matrix.name }}-tui
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true